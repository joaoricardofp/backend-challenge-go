services:
  db:
    image: postgres:17-alpine
    container_name: backend-challenge-go
    restart: unless-stopped
    environment:
      POSTGRES_DB: backend-challenge-go
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backend-challenge-go"]
      interval: 5s
      timeout: 5s
      retries: 5

  # IdP OIDC de referência (README §2/§4). O realm `wager` é importado
  # automaticamente de ./keycloak/realm-wager.json a cada criação do
  # container (start-dev --import-realm; sem volume de dados, o import roda
  # sempre que o container é recriado). Identidades locais de teste:
  #   wager-provider-a / local-test-secret-provider-a (provider 11111111-...)
  #   wager-provider-b / local-test-secret-provider-b (provider 22222222-...)
  #   wager-internal   / local-test-secret-internal   (serviço interno 00000000-...-0001)
  # Segredos exclusivamente locais, via client_credentials. Configure
  # OIDC_ISSUER=http://localhost:8081/realms/wager e OIDC_AUDIENCE=wager-api.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: backend-challenge-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-wager.json:/opt/keycloak/data/import/realm-wager.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo ok >&3"]
      interval: 10s
      timeout: 5s
      retries: 12

  # SQS local (B3.13): fila de entrada (consumer de wagering), fila de
  # eventos (publisher da outbox) e DLQ de eventos (tentativas esgotadas).
  # As filas são criadas automaticamente pelo script init (ready.d).
  # URLs locais: http://localhost:4566/000000000000/<nome-da-fila>.
  localstack:
    image: localstack/localstack:3
    container_name: backend-challenge-localstack
    restart: unless-stopped
    environment:
      SERVICES: sqs
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d
      - localstack_data:/var/lib/localstack

  # Aplicação (Dockerfile multi-stage). Sem OIDC habilitado por padrão aqui:
  # defina OIDC_* para fluxos autenticados (ver .env.example). Dentro da
  # rede do Compose, Keycloak atende em http://keycloak:8080 e o issuer do
  # token precisa coincidir com OIDC_ISSUER (tokens obtidos via
  # http://keycloak:8080 têm iss keycloak:8080).
  app:
    build: .
    container_name: backend-challenge-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_started
      keycloak:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/backend-challenge-go
      HTTP_ADDR: :8080
      OIDC_ENABLED: "true"
      OIDC_ISSUER: http://keycloak:8080/realms/wager
      OIDC_AUDIENCE: wager-api
      SQS_ENABLED: "true"
      SQS_REGION: us-east-1
      SQS_ENDPOINT: http://localstack:4566
      SQS_WAGER_QUEUE_URL: http://localstack:4566/000000000000/wager-input
      SQS_OUTBOX_QUEUE_URL: http://localstack:4566/000000000000/wager-events
      SQS_OUTBOX_DLQ_URL: http://localstack:4566/000000000000/wager-events-dlq
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/live | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Migrations 001-004 em ordem, idempotentes (controle em schema_migrations).
  migrate:
    image: postgres:17-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/backend-challenge-go
    volumes:
      - ./migrations:/migrations:ro
      - ./migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]

volumes:
  postgres_data:
  localstack_data:
